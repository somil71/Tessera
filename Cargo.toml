[package]
name = "raster-compiler"
version = "0.1.0"
edition = "2024"
description = "Tessera: Memory-bounded execution planning for large raster inference"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/somil71/Tessera"
readme = "README.md"
keywords = ["gis", "raster", "geospatial", "onnx", "inference"]
categories = ["science::geo", "command-line-utilities"]

[dependencies]
clap = { version = "4.5", features = ["derive"] }
onnx-protobuf = "0.2.3"
ort = { version = "=2.0.0-rc.15", default-features = false, features = ["std", "load-dynamic", "api-31"] }
protobuf = "=3.4.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
