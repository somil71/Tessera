[package]
name = "raster-compiler"
version = "0.1.0"
edition = "2024"
description = "Memory-bounded execution planning for large raster inference"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
onnx-protobuf = "0.2.3"
ort = { version = "=2.0.0-rc.15", default-features = false, features = ["std", "load-dynamic", "api-31"] }
protobuf = "=3.4.0"
