name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-windows:
    name: Rust & Python Tests (Windows)
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Create Virtual Environment and Install Dependencies
        shell: powershell
        run: |
          python -m venv .venv
          .\.venv\Scripts\python.exe -m pip install --upgrade pip
          .\.venv\Scripts\python.exe -m pip install -r requirements-lock-windows-py311.txt

      - name: Cargo Check and Clippy
        run: |
          cargo check
          cargo clippy --all-targets -- -D warnings

      - name: Cargo Build and Test
        run: |
          cargo build
          cargo test --verbose

      - name: Generate Evaluation Model Fixtures
        shell: powershell
        run: |
          .\.venv\Scripts\python.exe tests/fixtures/create_eval_models.py
          .\.venv\Scripts\python.exe tests/fixtures/create_pointwise_model.py

      - name: Run Doctor & Core Smoke Suites
        shell: powershell
        run: |
          .\.venv\Scripts\python.exe scripts/doctor.py
          .\.venv\Scripts\python.exe tests/fixtures/smoke_job_memory.py
          .\.venv\Scripts\python.exe tests/fixtures/smoke_constant_of_shape.py
          .\.venv\Scripts\python.exe tests/fixtures/smoke_pointwise_operators.py
          .\.venv\Scripts\python.exe tests/fixtures/smoke_auto_raster.py
          .\.venv\Scripts\python.exe tests/fixtures/smoke_whole_image_oracle.py
