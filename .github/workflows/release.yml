name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-release:
    name: Build & Publish Release
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build Release Binary
        run: cargo build --release

      - name: Package Windows Artifacts
        run: |
          New-Item -ItemType Directory -Force -Path dist
          Copy-Item target/release/raster-compiler.exe -Destination dist/tessera.exe
          Copy-Item README.md, LICENSE dist/
          Compress-Archive -Path dist/* -DestinationPath tessera-v0.1.0-windows-x64.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: tessera-v0.1.0-windows-x64.zip
          name: Tessera ${{ github.ref_name }}
          generate_release_notes: true
          draft: false
          prerelease: false
